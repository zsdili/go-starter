name: CI

# 工程化：任何 push 和 PR 都自动做格式检查、静态分析、单元测试、竞态检测和交叉编译。
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: 代码质量与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 格式检查 (gofmt)
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "以下文件未格式化："
            echo "$files"
            exit 1
          fi

      - name: 静态分析 (go vet)
        run: go vet ./...

      - name: 单元测试 + 竞态检测
        run: go test -race -coverprofile=coverage.out ./...

      - name: 覆盖率报告
        run: |
          echo "总覆盖率："
          go tool cover -func=coverage.out | tail -1

  build:
    name: 交叉编译
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 编译 ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA::7} -X main.buildAt=$(date -u +%FT%TZ)" \
            -o "dist/server-${GOOS}-${GOARCH}${ext}" ./cmd/server
          ls -lh dist/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7
